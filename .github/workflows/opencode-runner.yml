name: Central OpenCode Agent

on:
  workflow_call:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check for Develop Branch
        id: branch-check
        run: |
          set -euo pipefail

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/develop" || echo "0")

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "TARGET_BRANCH=develop" >> "$GITHUB_ENV"
            echo "Branch found! Targeting: develop"
          else
            echo "TARGET_BRANCH=main" >> "$GITHUB_ENV"
            echo "Branch not found or API failed! Falling back to: main"
          fi

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect Model Alias from Comment
        id: model-selector
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Default fallback model if no alias is found
          SELECTED_MODEL="opencode/muse-spark-1.2-contributor-free"

          # Match aliases safely from env var (multiline-safe)
          if [[ "$COMMENT_BODY" == *"@nemo"* ]]; then
            SELECTED_MODEL="opencode/nemotron-3-ultra-free" # 1,000,000	128,000
          elif [[ "$COMMENT_BODY" == *"@mimo"* ]]; then
            SELECTED_MODEL="kenari/mimo-v2-5:free" # 1,048,576	131,072
          elif [[ "$COMMENT_BODY" == *"@opus"* ]]; then
            SELECTED_MODEL="kenari/claude-opus-5" # 1,000,000	128,000
          elif [[ "$COMMENT_BODY" == *"@sonnet"* ]]; then
            SELECTED_MODEL="kenari/claude-sonnet-5" # 1,000,000	128,000
          elif [[ "$COMMENT_BODY" == *"@fable"* ]]; then
            SELECTED_MODEL="kenari/claude-fable-5" # 1,000,000	128,000
          elif [[ "$COMMENT_BODY" == *"@ling"* ]]; then
            SELECTED_MODEL="opencode/ling-3.0-flash-fin-free" # 262,144	32,768
          elif [[ "$COMMENT_BODY" == *"@gpt"* ]]; then
            SELECTED_MODEL="kenari/gpt-5-5" # 1,050,000	128,000 alteratively unorouter/gpt-5.5:free
          elif [[ "$COMMENT_BODY" == *"@pickle"* ]]; then
            SELECTED_MODEL="opencode/big-pickle" # 200,000	32,000
          elif [[ "$COMMENT_BODY" == *"@mimopro"* ]]; then
            SELECTED_MODEL="kenari/mimo-v2-5-pro" # 1,048,576	131,072 alternatively aihubmix/xiaomi-mimo-v2.5-pro-free
          elif [[ "$COMMENT_BODY" == *"@muse"* ]]; then
            SELECTED_MODEL="opencode/muse-spark-1.2-contributor-free" # 1,048,576	131,072
          elif [[ "$COMMENT_BODY" == *"@kimik3"* ]]; then
            SELECTED_MODEL="kenari/kimi-k3" # 1,048,576	131,072
          elif [[ "$COMMENT_BODY" == *"@qwen"* ]]; then
            SELECTED_MODEL="kenari/qwen3-8-max" # 1,000,000	131,072 alternatively alibaba-token-plan/qwen3.8-flash
          elif [[ "$COMMENT_BODY" == *"@deepseek"* ]]; then
            SELECTED_MODEL="kenari/deepseek-v4-flash:free" # 1,000,000	384,000 alternatively alibaba-token-plan/deepseek-v4-flash-0731
          elif [[ "$COMMENT_BODY" == *"@xpre"* ]]; then
            SELECTED_MODEL="opencode/x-preview-f-free" # 1,000,000	131,072
          elif [[ "$COMMENT_BODY" == *"@gemini"* ]]; then
            SELECTED_MODEL="kenari/gemini-3-1-pro" # 1,048,576	65,536
          elif [[ "$COMMENT_BODY" == *"@poolside"* ]]; then
            SELECTED_MODEL="openrouter/poolside/laguna-s-2.1:free" # 256,000	32,768 alternatively opencode/laguna-s-2.1-free
          fi

          echo "chosen_model=$SELECTED_MODEL" >> "$GITHUB_OUTPUT"

      - name: Run opencode
        id: run-opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          KENARI_API_KEY: ${{ secrets.KENARI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ steps.model-selector.outputs.chosen_model }}
          use_github_token: true

      # SAFETY NET: force-correct the PR's base branch regardless of what
      # the action actually did with the inputs above. Verify against
      # anomalyco/opencode's action.yml whether it exposes a PR number
      # output — if it does, swap the heuristic below for that instead
      # of "most recent open PR" to avoid any race with concurrent runs.
      - name: Force-correct PR base branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Give the API a moment to register the PR the action just opened
          sleep 5

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --json number,baseRefName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[0].number" || echo "")

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            CURRENT_BASE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json baseRefName --jq .baseRefName)
            if [ "$CURRENT_BASE" != "$TARGET_BRANCH" ]; then
              echo "PR #$PR_NUMBER opened against '$CURRENT_BASE' — correcting to '$TARGET_BRANCH'"
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --base "$TARGET_BRANCH"
            else
              echo "PR #$PR_NUMBER already targets '$TARGET_BRANCH' — no action needed"
            fi
          else
            echo "No open PR found to correct — skipping"
          fi
